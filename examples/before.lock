# Synthetic demonstration; URLs and hashes are not installable artifacts.
version = 1
revision = 3
requires-python = ">=3.11"
resolution-markers = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [{ name = "corelib" }]

[package.metadata]
requires-dist = [{ name = "corelib", extras = ["speed", "cli"] }]

[[package]]
name = "corelib"
version = "1.0.0"
source = { registry = "https://example.test/simple" }
wheels = [
    { url = "https://example.test/corelib-1.0.0.whl", hash = "sha256:old", size = 120 },
]
