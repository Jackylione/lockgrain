# Only the wheel hash changes; marker/extras ordering also changes.
version = 1
revision = 3
requires-python = ">=3.11"
resolution-markers = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [{ name = "corelib" }]

[package.metadata]
requires-dist = [{ name = "corelib", extras = ["cli", "speed"] }]

[[package]]
name = "corelib"
version = "1.0.0"
source = { registry = "https://example.test/simple" }
wheels = [
    { size = 120, hash = "sha256:new", url = "https://example.test/corelib-1.0.0.whl" },
]
